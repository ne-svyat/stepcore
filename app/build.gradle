plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.vasil.stepcore'
    compileSdk 34

    defaultConfig {
        applicationId "com.vasil.stepcore"
        minSdk 30
        targetSdk 34
        versionCode 433
        versionName "3.5.17"
    }

    // v285. Ключ подписи БОЛЬШЕ НЕ ЛЕЖИТ В РЕПОЗИТОРИИ.
    //
    // Было: release.keystore закоммичен, а пароль к нему лежал открытым
    // текстом прямо в этом файле. Любой, кто видел репозиторий, мог собрать APK,
    // подписанный тем же ключом, и он установился бы пользователю поверх
    // настоящего как обычное обновление. Тот ключ считается сгоревшим.
    //
    // Стало: путь и пароли берутся из окружения. Локально - из
    // ~/.gradle/gradle.properties (файл вне репозитория), в GitHub Actions -
    // из Secrets. Если ключа нет, сборка НЕ падает: подписывается
    // стандартным отладочным ключом, просто такой APK не встанет
    // обновлением поверх подписанного настоящим.
    def ksPath = System.getenv("STEPCORE_KEYSTORE") ?:
        (project.findProperty("stepcoreKeystore") ?: "")
    def ksPass = System.getenv("STEPCORE_KEYSTORE_PASSWORD") ?:
        (project.findProperty("stepcoreKeystorePassword") ?: "")
    def ksAlias = System.getenv("STEPCORE_KEY_ALIAS") ?:
        (project.findProperty("stepcoreKeyAlias") ?: "stepcore")
    def ksAliasPass = System.getenv("STEPCORE_KEY_PASSWORD") ?:
        (project.findProperty("stepcoreKeyPassword") ?: "")
    def haveKeystore = ksPath && !ksPath.isEmpty() && file(ksPath).exists()

    signingConfigs {
        stable {
            if (haveKeystore) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksAliasPass
            }
        }
    }

    buildTypes {
        debug {
            if (haveKeystore) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // v437. Activity Recognition через Google Play services.
    // StepCore сам остаётся без INTERNET permission.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    ksp 'androidx.room:room-compiler:2.6.1'
}
