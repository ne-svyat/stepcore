name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # v286. Контекст secrets НЕЛЬЗЯ использовать в if - GitHub отклоняет
    # такой файл при разборе, до запуска ("Unrecognized named-value").
    # На уровне env он разрешён, поэтому наличие ключа превращается здесь
    # в обычную строку "true"/"false", а шаги проверяют уже её.
    # Сам ключ сюда не кладём: в env он был бы виден всем шагам,
    # включая сборку, где он не нужен.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # v285. Ключ приезжает из Secrets, а не из репозитория. Если секреты
      # не заданы (например, в форке), шаг просто ничего не создаёт, и
      # сборка идёт с отладочной подписью - падать она не должна.
      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/stepcore.keystore"
          echo "STEPCORE_KEYSTORE=$RUNNER_TEMP/stepcore.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          STEPCORE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STEPCORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STEPCORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug

      # Ключ не должен пережить сборку даже на одноразовой машине.
      - name: Wipe signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stepcore.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: stepcore-apk
          path: app/build/outputs/apk/debug/app-debug.apk
