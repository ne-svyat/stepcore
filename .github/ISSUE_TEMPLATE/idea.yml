name: Идея или вопрос
description: Предложение, непонятное место в интерфейсе, вопрос по работе
labels: ["идея"]
body:
  - type: markdown
    attributes:
      value: |
        Одно правило проекта, чтобы ожидания были честными:
        **ядро счёта шагов меняется только по собранным данным.**
        Идея без измерения — не повод трогать то, что работает.
        Всё остальное обсуждаемо.

  - type: textarea
    id: idea
    attributes:
      label: Суть
      description: Что предлагаете или что непонятно
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Зачем это вам
      description: |
        Важнее самой идеи. Задача, которую вы решаете, часто решается
        иначе и проще, чем предложенным способом.
